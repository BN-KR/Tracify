name: Activation contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  activation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install application dependencies
        run: npm ci --legacy-peer-deps
      - name: Check the canonical activation contract
        run: npm run test:activation
      - name: Validate public content
        run: npm run test:content
