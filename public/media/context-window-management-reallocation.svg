<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cwReallocTitle">
  <title id="cwReallocTitle">Stacked bar chart across four points in a long-running agent session showing conversation history growing until a rolling summarization pass compacts it back down, while system prompt and tool definitions stay fixed and scratch memory fluctuates</title>
  <rect width="1600" height="900" fill="#ffffff"/>
  <rect x="0" y="0" width="1600" height="900" fill="none" stroke="#000000" stroke-width="4"/>

  <text x="90" y="90" font-family="monospace" font-size="26" letter-spacing="3" fill="#000000">BUDGET ACROSS A LONG-RUNNING SESSION</text>
  <text x="90" y="128" font-family="monospace" font-size="18" fill="#000000">Same four components, tracked at four points in one run</text>

  <!-- Baseline -->
  <line x1="140" y1="780" x2="1500" y2="780" stroke="#000000" stroke-width="3"/>
  <!-- Limit line -->
  <line x1="140" y1="200" x2="1500" y2="200" stroke="#000000" stroke-width="3" stroke-dasharray="14 10"/>
  <text x="1330" y="192" font-family="monospace" font-size="18" fill="#000000">CONTEXT LIMIT</text>

  <!-- Turn 1 -->
  <g>
    <rect x="220" y="720" width="180" height="60" fill="#000000"/>
    <rect x="220" y="680" width="180" height="40" fill="#4b4b4b"/>
    <rect x="220" y="640" width="180" height="40" fill="#8a8a8a"/>
    <rect x="220" y="610" width="180" height="30" fill="#f4d44d"/>
    <text x="255" y="815" font-family="monospace" font-size="20" fill="#000000">TURN 1</text>
  </g>

  <!-- Turn 25: history grows -->
  <g>
    <rect x="500" y="720" width="180" height="60" fill="#000000"/>
    <rect x="500" y="680" width="180" height="40" fill="#4b4b4b"/>
    <rect x="500" y="470" width="180" height="210" fill="#8a8a8a"/>
    <rect x="500" y="420" width="180" height="50" fill="#f4d44d"/>
    <text x="530" y="815" font-family="monospace" font-size="20" fill="#000000">TURN 25</text>
  </g>

  <!-- Turn 40: near the limit, unbounded -->
  <g>
    <rect x="780" y="720" width="180" height="60" fill="#000000"/>
    <rect x="780" y="680" width="180" height="40" fill="#4b4b4b"/>
    <rect x="780" y="270" width="180" height="410" fill="#8a8a8a"/>
    <rect x="780" y="220" width="180" height="50" fill="#f4d44d"/>
    <text x="800" y="815" font-family="monospace" font-size="20" fill="#000000">TURN 40</text>
    <text x="770" y="205" font-family="monospace" font-size="16" fill="#000000">no compaction</text>
  </g>

  <!-- Turn 41: after rolling summarization compacts history -->
  <g>
    <rect x="1060" y="720" width="180" height="60" fill="#000000"/>
    <rect x="1060" y="680" width="180" height="40" fill="#4b4b4b"/>
    <rect x="1060" y="600" width="180" height="80" fill="#8a8a8a"/>
    <rect x="1060" y="560" width="180" height="40" fill="#f4d44d"/>
    <text x="1055" y="815" font-family="monospace" font-size="20" fill="#000000">TURN 41</text>
    <text x="1020" y="545" font-family="monospace" font-size="16" fill="#000000">after summarization</text>
  </g>

  <!-- Legend -->
  <g font-family="monospace" font-size="18" fill="#000000">
    <rect x="1340" y="620" width="24" height="24" fill="#000000"/>
    <text x="1372" y="638">System prompt</text>
    <rect x="1340" y="654" width="24" height="24" fill="#4b4b4b"/>
    <text x="1372" y="672">Tool definitions</text>
    <rect x="1340" y="688" width="24" height="24" fill="#8a8a8a"/>
    <text x="1372" y="706">History</text>
    <rect x="1340" y="722" width="24" height="24" fill="#f4d44d"/>
    <text x="1372" y="740">Scratch</text>
  </g>

  <text x="90" y="860" font-family="monospace" font-size="18" fill="#000000">History climbs turn over turn until a compaction pass resets it; system prompt and tools stay flat throughout.</text>
</svg>
