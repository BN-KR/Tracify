<svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="460" fill="#000000"/>
  <text x="40" y="48" fill="#FFFFFF" font-family="monospace" font-size="22">An autoscaling agent workload, request to teardown</text>
  <g stroke="#FFFFFF" stroke-width="2" fill="none">
    <rect x="40" y="90" width="160" height="70"/>
    <rect x="260" y="90" width="160" height="70"/>
    <rect x="480" y="90" width="160" height="70"/>
    <rect x="700" y="90" width="160" height="70"/>
    <path d="M200 125 L260 125"/>
    <path d="M420 125 L480 125"/>
    <path d="M640 125 L700 125"/>
  </g>
  <text x="55" y="120" fill="#FFFFFF" font-family="monospace" font-size="13">Request queue</text>
  <text x="55" y="140" fill="#FFFFFF" font-family="monospace" font-size="13">(API-driven)</text>
  <text x="275" y="120" fill="#FFFFFF" font-family="monospace" font-size="13">Scheduler</text>
  <text x="275" y="140" fill="#FFFFFF" font-family="monospace" font-size="13">checks pool</text>
  <text x="495" y="120" fill="#FFFFFF" font-family="monospace" font-size="13">Cold or warm</text>
  <text x="495" y="140" fill="#FFFFFF" font-family="monospace" font-size="13">container start</text>
  <text x="715" y="120" fill="#FFFFFF" font-family="monospace" font-size="13">Agent runs,</text>
  <text x="715" y="140" fill="#FFFFFF" font-family="monospace" font-size="13">emits spans</text>
  <line x1="40" y1="230" x2="960" y2="230" stroke="#FFFFFF" stroke-width="1" opacity="0.3"/>
  <text x="40" y="260" fill="#FFFFFF" font-family="monospace" font-size="16">Idle instances scale to zero after cooldown window</text>
  <text x="40" y="288" fill="#FFFFFF" font-family="monospace" font-size="16">Traces and cost tags persist after the container is gone</text>
  <text x="40" y="316" fill="#FFFFFF" font-family="monospace" font-size="16">Multi-tenant isolation enforced at the scheduler and network layer</text>
  <rect x="40" y="350" width="920" height="70" fill="#FFFFFF"/>
  <text x="60" y="380" fill="#000000" font-family="monospace" font-size="15">Observability must survive the container: correlate by run ID,</text>
  <text x="60" y="402" fill="#000000" font-family="monospace" font-size="15">not by hostname or process ID that disappears at teardown.</text>
</svg>
