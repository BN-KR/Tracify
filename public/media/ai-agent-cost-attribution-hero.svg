<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="acaHeroTitle acaHeroDesc">
  <title id="acaHeroTitle">Three tenant usage streams merge into one provider invoice, then split back into ledgers with a leftover unattributed slice</title>
  <desc id="acaHeroDesc">A black canvas diagram showing three labeled tenant streams converging into a single box marked provider invoice, then diverging into four boxes on the right: three tenant ledgers with dollar figures and a fourth dashed red-outlined box labeled unattributed, showing the spend nobody can bill or explain when tagging happens after the invoice arrives.</desc>
  <rect width="1600" height="900" fill="#0a0a0a"/>
  <text x="100" y="90" fill="#f4d44d" font-family="monospace" font-size="20" letter-spacing="2">AI AGENT COST ATTRIBUTION</text>
  <text x="100" y="122" fill="#f6f1e6" font-family="monospace" font-size="14" opacity="0.6">chargeback and showback for multi-tenant spend</text>

  <g font-family="monospace" font-size="13" fill="#f6f1e6">
    <!-- left tenant source nodes -->
    <rect x="120" y="230" width="230" height="70" fill="none" stroke="#f6f1e6" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="235" y="270" text-anchor="middle" opacity="0.85">TENANT A CALLS</text>

    <rect x="120" y="410" width="230" height="70" fill="none" stroke="#f6f1e6" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="235" y="450" text-anchor="middle" opacity="0.85">TENANT B CALLS</text>

    <rect x="120" y="590" width="230" height="70" fill="none" stroke="#f6f1e6" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="235" y="630" text-anchor="middle" opacity="0.85">TENANT C CALLS</text>

    <!-- converging lines into invoice box -->
    <line x1="350" y1="265" x2="650" y2="400" stroke="#f6f1e6" stroke-opacity="0.35" stroke-width="1.5"/>
    <line x1="350" y1="445" x2="650" y2="450" stroke="#f6f1e6" stroke-opacity="0.35" stroke-width="1.5"/>
    <line x1="350" y1="625" x2="650" y2="500" stroke="#f6f1e6" stroke-opacity="0.35" stroke-width="1.5"/>

    <!-- central invoice box -->
    <rect x="650" y="360" width="300" height="180" fill="#f6f1e6" fill-opacity="0.08" stroke="#f6f1e6" stroke-width="1.5"/>
    <text x="800" y="430" text-anchor="middle" fill="#f4d44d" font-size="15">PROVIDER INVOICE</text>
    <text x="800" y="460" text-anchor="middle" opacity="0.75">$14,208 / month</text>
    <text x="800" y="485" text-anchor="middle" opacity="0.5" font-size="11">one pooled number</text>

    <!-- diverging lines out to ledgers -->
    <line x1="950" y1="410" x2="1150" y2="185" stroke="#f6f1e6" stroke-opacity="0.35" stroke-width="1.5"/>
    <line x1="950" y1="440" x2="1150" y2="365" stroke="#f6f1e6" stroke-opacity="0.35" stroke-width="1.5"/>
    <line x1="950" y1="470" x2="1150" y2="545" stroke="#f6f1e6" stroke-opacity="0.35" stroke-width="1.5"/>
    <line x1="950" y1="500" x2="1150" y2="725" stroke="#e2694f" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="6,5"/>

    <!-- right ledger nodes -->
    <rect x="1150" y="150" width="280" height="70" fill="#f4d44d" fill-opacity="0.12" stroke="#f4d44d" stroke-width="1.5"/>
    <text x="1290" y="180" text-anchor="middle" fill="#f4d44d">TENANT A LEDGER</text>
    <text x="1290" y="202" text-anchor="middle" opacity="0.7" font-size="12">$4,900 metered</text>

    <rect x="1150" y="330" width="280" height="70" fill="#f4d44d" fill-opacity="0.12" stroke="#f4d44d" stroke-width="1.5"/>
    <text x="1290" y="360" text-anchor="middle" fill="#f4d44d">TENANT B LEDGER</text>
    <text x="1290" y="382" text-anchor="middle" opacity="0.7" font-size="12">$3,150 metered</text>

    <rect x="1150" y="510" width="280" height="70" fill="#f4d44d" fill-opacity="0.12" stroke="#f4d44d" stroke-width="1.5"/>
    <text x="1290" y="540" text-anchor="middle" fill="#f4d44d">TENANT C LEDGER</text>
    <text x="1290" y="562" text-anchor="middle" opacity="0.7" font-size="12">$2,760 metered</text>

    <rect x="1150" y="690" width="280" height="70" fill="none" stroke="#e2694f" stroke-width="1.5" stroke-dasharray="6,5"/>
    <text x="1290" y="720" text-anchor="middle" fill="#e2694f">UNATTRIBUTED</text>
    <text x="1290" y="742" text-anchor="middle" fill="#e2694f" opacity="0.8" font-size="12">$3,398 — nobody to bill</text>
  </g>

  <text x="100" y="850" fill="#f6f1e6" font-family="monospace" font-size="13" opacity="0.45">tag at the span, or the invoice arrives already unmixed and impossible to trace back</text>
</svg>
