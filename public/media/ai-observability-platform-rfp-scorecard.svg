<svg viewBox="0 0 1600 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="platScoreTitle platScoreDesc">
  <title id="platScoreTitle">A scorecard listing six evaluation criteria with weighted bars</title>
  <desc id="platScoreDesc">A black canvas shows six horizontal acid-yellow bars of varying length on a cream scorecard, each labeled with a platform evaluation criterion: trace fidelity, evaluation depth, alert routing, data residency, pricing model, and migration path.</desc>
  <rect width="1600" height="760" fill="#0a0a0a"/>
  <rect x="120" y="80" width="1360" height="600" fill="#f6f1e6"/>
  <text x="800" y="60" text-anchor="middle" fill="#f6f1e6" font-family="monospace" font-size="20" letter-spacing="2">PLATFORM EVALUATION SCORECARD</text>

  <g font-family="monospace" font-size="16" fill="#0a0a0a">
    <text x="160" y="150">TRACE FIDELITY</text>
    <rect x="560" y="128" width="820" height="28" fill="#f4d44d"/>

    <text x="160" y="230">EVALUATION DEPTH</text>
    <rect x="560" y="208" width="700" height="28" fill="#f4d44d"/>

    <text x="160" y="310">ALERT ROUTING</text>
    <rect x="560" y="288" width="500" height="28" fill="#f4d44d"/>

    <text x="160" y="390">DATA RESIDENCY</text>
    <rect x="560" y="368" width="380" height="28" fill="#f4d44d"/>

    <text x="160" y="470">PRICING MODEL</text>
    <rect x="560" y="448" width="620" height="28" fill="#f4d44d"/>

    <text x="160" y="550">MIGRATION PATH</text>
    <rect x="560" y="528" width="300" height="28" fill="#f4d44d"/>
  </g>
  <text x="800" y="630" text-anchor="middle" fill="#0a0a0a" font-family="monospace" font-size="13" opacity="0.7">BAR LENGTH = WEIGHT IN THE FINAL DECISION, NOT A VENDOR SCORE</text>
</svg>
