<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lgmrHeroTitle lgmrHeroDesc">
  <title id="lgmrHeroTitle">One request stream splitting across three model tiers at a routing gateway, with a ledger recording every decision</title>
  <desc id="lgmrHeroDesc">A black canvas shows a single incoming request stream entering a gateway box on the left, then splitting into three lanes labeled cheap and fast, mid tier, and premium, each leading to a different provider block on the right. A thin connecting line runs from every lane down to a ledger strip at the bottom that records which model served each request and why, illustrating that the routing decision itself is a piece of evidence, not just the model's output.</desc>
  <rect width="1600" height="900" fill="#0a0a0a"/>

  <text x="100" y="90" fill="#f4d44d" font-family="monospace" font-size="20" letter-spacing="2">LLM GATEWAY &amp; MODEL ROUTING</text>
  <text x="100" y="122" fill="#f6f1e6" font-family="monospace" font-size="14" opacity="0.6">one request, three eligible tiers, one recorded decision</text>

  <!-- incoming request -->
  <g font-family="monospace" font-size="13">
    <rect x="90" y="380" width="180" height="70" fill="none" stroke="#f6f1e6" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="180" y="410" fill="#f6f1e6" text-anchor="middle" opacity="0.85">INCOMING</text>
    <text x="180" y="430" fill="#f6f1e6" text-anchor="middle" opacity="0.85">REQUEST</text>
  </g>

  <!-- gateway -->
  <rect x="340" y="350" width="220" height="130" fill="#f4d44d" fill-opacity="0.1" stroke="#f4d44d" stroke-width="2"/>
  <text x="450" y="405" fill="#f4d44d" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold">GATEWAY</text>
  <text x="450" y="428" fill="#f4d44d" text-anchor="middle" font-family="monospace" font-size="12" opacity="0.85">eligibility +</text>
  <text x="450" y="446" fill="#f4d44d" text-anchor="middle" font-family="monospace" font-size="12" opacity="0.85">routing signal</text>

  <line x1="270" y1="415" x2="340" y2="415" stroke="#f6f1e6" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- three lanes -->
  <g stroke="#f6f1e6" stroke-opacity="0.35" stroke-width="1.5">
    <path d="M 560 390 L 700 220" fill="none"/>
    <path d="M 560 415 L 700 415" fill="none"/>
    <path d="M 560 440 L 700 610" fill="none"/>
  </g>

  <g font-family="monospace" font-size="13">
    <rect x="700" y="170" width="260" height="100" fill="none" stroke="#7fbf7f" stroke-width="1.5"/>
    <text x="830" y="210" fill="#7fbf7f" text-anchor="middle" font-weight="bold">CHEAP &amp; FAST</text>
    <text x="830" y="232" fill="#7fbf7f" text-anchor="middle" opacity="0.75">first attempt, most traffic</text>
    <text x="830" y="252" fill="#7fbf7f" text-anchor="middle" opacity="0.6" font-size="11">tier A</text>

    <rect x="700" y="365" width="260" height="100" fill="none" stroke="#f4d44d" stroke-width="1.5"/>
    <text x="830" y="405" fill="#f4d44d" text-anchor="middle" font-weight="bold">MID TIER</text>
    <text x="830" y="427" fill="#f4d44d" text-anchor="middle" opacity="0.75">escalate on low confidence</text>
    <text x="830" y="447" fill="#f4d44d" text-anchor="middle" opacity="0.6" font-size="11">tier B</text>

    <rect x="700" y="560" width="260" height="100" fill="none" stroke="#e06a5a" stroke-width="1.5"/>
    <text x="830" y="600" fill="#e06a5a" text-anchor="middle" font-weight="bold">PREMIUM</text>
    <text x="830" y="622" fill="#e06a5a" text-anchor="middle" opacity="0.75">hard tasks, high stakes</text>
    <text x="830" y="642" fill="#e06a5a" text-anchor="middle" opacity="0.6" font-size="11">tier C</text>
  </g>

  <!-- provider blocks -->
  <g font-family="monospace" font-size="12" fill="#f6f1e6" opacity="0.7">
    <line x1="960" y1="220" x2="1080" y2="220" stroke="#f6f1e6" stroke-opacity="0.35"/>
    <text x="1090" y="224">provider 1</text>
    <line x1="960" y1="415" x2="1080" y2="415" stroke="#f6f1e6" stroke-opacity="0.35"/>
    <text x="1090" y="419">provider 2</text>
    <line x1="960" y1="610" x2="1080" y2="610" stroke="#f6f1e6" stroke-opacity="0.35"/>
    <text x="1090" y="614">provider 1 or 3</text>
  </g>

  <!-- ledger strip -->
  <g stroke="#f6f1e6" stroke-opacity="0.25" stroke-width="1">
    <line x1="830" y1="270" x2="830" y2="740"/>
    <line x1="830" y1="465" x2="830" y2="740"/>
    <line x1="830" y1="660" x2="830" y2="740"/>
  </g>
  <rect x="450" y="740" width="760" height="90" fill="#f4d44d" fill-opacity="0.08" stroke="#f4d44d" stroke-width="2"/>
  <text x="830" y="775" fill="#f4d44d" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold">ROUTING LEDGER</text>
  <text x="830" y="800" fill="#f6f1e6" text-anchor="middle" font-family="monospace" font-size="12" opacity="0.75">tier, model, signal value, and reason recorded on every request</text>

  <text x="100" y="855" fill="#f6f1e6" font-family="monospace" font-size="13" opacity="0.45">a quality regression can come from the model or from the decision that picked it — only the ledger can tell you which</text>
</svg>
