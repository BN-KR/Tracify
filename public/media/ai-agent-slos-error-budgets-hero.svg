<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sloTitle sloDesc">
  <title id="sloTitle">Four reliability gauges feeding one error budget meter, with quality in the red</title>
  <desc id="sloDesc">A black canvas shows four small circular gauges labeled availability, reliability, quality, and efficiency, three reading green/healthy and one labeled quality reading in the red zone, all four connected by lines feeding into one larger error budget meter below.</desc>
  <rect width="1600" height="900" fill="#0a0a0a"/>
  <text x="100" y="90" fill="#f4d44d" font-family="monospace" font-size="20" letter-spacing="2">AI AGENT SLOs &amp; ERROR BUDGETS</text>
  <text x="100" y="122" fill="#f6f1e6" font-family="monospace" font-size="14" opacity="0.6">four-indicator model</text>

  <g font-family="monospace" font-size="13">
    <!-- 4 gauges -->
    <g>
      <circle cx="330" cy="300" r="70" fill="none" stroke="#f6f1e6" stroke-opacity="0.3" stroke-width="10"/>
      <path d="M 330 230 A 70 70 0 1 1 268 335" fill="none" stroke="#7fbf7f" stroke-width="10"/>
      <text x="330" y="400" fill="#f6f1e6" text-anchor="middle" opacity="0.75">AVAILABILITY</text>
    </g>
    <g>
      <circle cx="620" cy="300" r="70" fill="none" stroke="#f6f1e6" stroke-opacity="0.3" stroke-width="10"/>
      <path d="M 620 230 A 70 70 0 1 1 555 320" fill="none" stroke="#7fbf7f" stroke-width="10"/>
      <text x="620" y="400" fill="#f6f1e6" text-anchor="middle" opacity="0.75">RELIABILITY</text>
    </g>
    <g>
      <circle cx="910" cy="300" r="70" fill="none" stroke="#f6f1e6" stroke-opacity="0.3" stroke-width="10"/>
      <path d="M 910 230 A 70 70 0 0 1 975 340" fill="none" stroke="#e06a5a" stroke-width="10"/>
      <text x="910" y="400" fill="#f4d44d" text-anchor="middle" font-weight="bold">QUALITY</text>
    </g>
    <g>
      <circle cx="1200" cy="300" r="70" fill="none" stroke="#f6f1e6" stroke-opacity="0.3" stroke-width="10"/>
      <path d="M 1200 230 A 70 70 0 1 1 1140 330" fill="none" stroke="#7fbf7f" stroke-width="10"/>
      <text x="1200" y="400" fill="#f6f1e6" text-anchor="middle" opacity="0.75">EFFICIENCY</text>
    </g>
  </g>

  <g stroke="#f6f1e6" stroke-opacity="0.35" stroke-width="1.5">
    <line x1="330" y1="370" x2="700" y2="560"/>
    <line x1="620" y1="370" x2="750" y2="560"/>
    <line x1="910" y1="370" x2="850" y2="560"/>
    <line x1="1200" y1="370" x2="900" y2="560"/>
  </g>

  <rect x="600" y="560" width="400" height="120" fill="#f4d44d" fill-opacity="0.1" stroke="#f4d44d" stroke-width="2"/>
  <text x="800" y="610" fill="#f4d44d" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold">ERROR BUDGET</text>
  <rect x="630" y="630" width="340" height="18" fill="none" stroke="#f6f1e6" stroke-opacity="0.5"/>
  <rect x="630" y="630" width="230" height="18" fill="#e06a5a" fill-opacity="0.6"/>

  <text x="100" y="850" fill="#f6f1e6" font-family="monospace" font-size="13" opacity="0.45">an agent can look healthy on three indicators and still be failing on the fourth</text>
</svg>
