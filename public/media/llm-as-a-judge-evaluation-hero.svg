<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="jgTitle jgDesc">
  <title id="jgTitle">Three parallel lanes routing evaluation criteria to a rule, a model, or a person</title>
  <desc id="jgDesc">A black canvas shows three parallel horizontal lanes, one marked with a simple rule-check icon for deterministic checks, one marked with a stylized outline for an LLM judge, and one marked with a person silhouette for human review, each receiving different small labeled tokens flowing in from the left.</desc>
  <rect width="1600" height="900" fill="#0a0a0a"/>
  <text x="100" y="90" fill="#f4d44d" font-family="monospace" font-size="20" letter-spacing="2">LLM-AS-A-JUDGE EVALUATION</text>
  <text x="100" y="122" fill="#f6f1e6" font-family="monospace" font-size="14" opacity="0.6">three-layer routing model</text>

  <g font-family="monospace" font-size="13" fill="#f6f1e6">
    <!-- lane 1: deterministic -->
    <line x1="180" y1="250" x2="1300" y2="250" stroke="#f6f1e6" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect x="1180" y="215" width="150" height="70" fill="none" stroke="#f6f1e6" stroke-opacity="0.6"/>
    <text x="1255" y="255" text-anchor="middle" opacity="0.8">RULE</text>
    <circle cx="300" cy="250" r="6" fill="#f6f1e6" opacity="0.6"/>
    <text x="320" y="230" opacity="0.6">format check</text>

    <!-- lane 2: judge -->
    <line x1="180" y1="450" x2="1300" y2="450" stroke="#f4d44d" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="1180" y="415" width="150" height="70" fill="none" stroke="#f4d44d" stroke-width="2"/>
    <text x="1255" y="455" text-anchor="middle" fill="#f4d44d" font-weight="bold">JUDGE</text>
    <circle cx="300" cy="450" r="6" fill="#f4d44d"/>
    <text x="320" y="430" fill="#f4d44d">tone</text>
    <circle cx="480" cy="450" r="6" fill="#f4d44d"/>
    <text x="500" y="430" fill="#f4d44d">preference</text>

    <!-- lane 3: human -->
    <line x1="180" y1="650" x2="1300" y2="650" stroke="#f6f1e6" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect x="1180" y="615" width="150" height="70" fill="none" stroke="#f6f1e6" stroke-opacity="0.6"/>
    <text x="1255" y="655" text-anchor="middle" opacity="0.8">HUMAN</text>
    <circle cx="300" cy="650" r="6" fill="#f6f1e6" opacity="0.6"/>
    <text x="320" y="630" opacity="0.6">high-stakes action</text>
  </g>

  <text x="100" y="850" fill="#f6f1e6" font-family="monospace" font-size="13" opacity="0.45">route each criterion by what it actually requires, not by default</text>
</svg>
