<svg viewBox="0 0 1600 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vaBargeTitle vaBargeDesc">
  <title id="vaBargeTitle">A barge-in sequence showing the agent still speaking after the user starts talking, and the resulting talk-over window</title>
  <desc id="vaBargeDesc">A black canvas shows two horizontal swimlanes, agent audio on top and user audio on bottom, moving left to right in time. The agent lane shows a continuous speaking block. Partway through, the user lane shows the user starting to speak. A yellow shaded region marks the gap between the user's first word and the moment the agent's audio actually stops, labeled "talk-over window — barge-in response time," illustrating the interval a voice trace must capture to explain why the agent kept talking.</desc>
  <rect width="1600" height="640" fill="#0a0a0a"/>
  <text x="80" y="60" fill="#f4d44d" font-family="monospace" font-size="18" letter-spacing="1">THE BARGE-IN RACE</text>
  <text x="80" y="88" fill="#f6f1e6" font-family="monospace" font-size="13" opacity="0.6">agent audio vs. user audio, same clock</text>

  <g font-family="monospace" font-size="13">
    <!-- lane labels -->
    <text x="80" y="200" fill="#f6f1e6" opacity="0.75">AGENT AUDIO</text>
    <text x="80" y="380" fill="#f6f1e6" opacity="0.75">USER AUDIO</text>

    <!-- timeline axis -->
    <line x1="320" y1="480" x2="1520" y2="480" stroke="#f6f1e6" stroke-opacity="0.3"/>
    <text x="320" y="502" fill="#f6f1e6" opacity="0.45" font-size="11">t = 0ms</text>
    <text x="1470" y="502" fill="#f6f1e6" opacity="0.45" font-size="11">t = 900ms</text>

    <!-- agent speaking block, continues through interruption -->
    <rect x="320" y="150" width="1050" height="60" fill="none" stroke="#f6f1e6" stroke-opacity="0.6" stroke-width="2"/>
    <text x="845" y="188" fill="#f6f1e6" text-anchor="middle" opacity="0.7">agent still speaking</text>

    <!-- user speech starting mid-way -->
    <rect x="760" y="330" width="560" height="60" fill="#f6f1e6" fill-opacity="0.12" stroke="#f6f1e6" stroke-opacity="0.6" stroke-width="2"/>
    <text x="1040" y="368" fill="#f6f1e6" text-anchor="middle" opacity="0.7">user interrupts</text>

    <!-- markers -->
    <line x1="760" y1="140" x2="760" y2="480" stroke="#f4d44d" stroke-width="2"/>
    <text x="760" y="128" fill="#f4d44d" text-anchor="middle" font-size="12">user starts talking</text>

    <line x1="1100" y1="140" x2="1100" y2="480" stroke="#f4d44d" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="1100" y="128" fill="#f4d44d" text-anchor="middle" font-size="12">agent audio actually stops</text>

    <!-- talk-over window -->
    <rect x="760" y="150" width="340" height="60" fill="#f4d44d" fill-opacity="0.35"/>
    <text x="930" y="440" fill="#f4d44d" text-anchor="middle" font-size="13">talk-over window</text>
    <text x="930" y="460" fill="#f4d44d" text-anchor="middle" font-size="12" opacity="0.8">barge-in response time ≈ 340ms</text>
  </g>

  <text x="80" y="600" fill="#f6f1e6" font-family="monospace" font-size="13" opacity="0.45">a trace with only start/stop timestamps hides this gap; the gap is the incident</text>
</svg>
