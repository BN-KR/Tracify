<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="obsMlopsOwnTitle obsMlopsOwnDesc">
  <title id="obsMlopsOwnTitle">Ownership map from experiment to production incident</title>
  <desc id="obsMlopsOwnDesc">A black canvas shows four stacked rows representing experiment tracking, the model registry, deployment automation, and production monitoring, each row naming the team most often responsible and the artifact that row hands to the row below it, ending with a production incident feeding back up to the experiment row as a labeled retraining loop.</desc>
  <rect width="1600" height="900" fill="#0a0a0a"/>
  <text x="100" y="90" fill="#f4d44d" font-family="monospace" font-size="20" letter-spacing="2">OWNERSHIP HANDOFF, END TO END</text>
  <text x="100" y="122" fill="#f6f1e6" font-family="monospace" font-size="14" opacity="0.6">who owns each artifact as it moves downstream</text>

  <g font-family="monospace" font-size="14">
    <rect x="140" y="170" width="1320" height="120" fill="#f6f1e6" fill-opacity="0.07" stroke="#f6f1e6" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="170" y="215" fill="#f6f1e6" opacity="0.9">Experiment tracking</text>
    <text x="170" y="241" fill="#f6f1e6" opacity="0.55" font-size="12">ML team · owns metrics, params, dataset versions</text>
    <text x="1050" y="228" fill="#f6f1e6" opacity="0.5" font-size="12">hands off &#8594; a candidate model</text>

    <rect x="140" y="320" width="1320" height="120" fill="#f6f1e6" fill-opacity="0.07" stroke="#f6f1e6" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="170" y="365" fill="#f6f1e6" opacity="0.9">Model registry</text>
    <text x="170" y="391" fill="#f6f1e6" opacity="0.55" font-size="12">platform/MLOps team · owns lineage, approval, versioning</text>
    <text x="1050" y="378" fill="#f6f1e6" opacity="0.5" font-size="12">hands off &#8594; a deployable artifact</text>

    <rect x="140" y="470" width="1320" height="120" fill="#f6f1e6" fill-opacity="0.07" stroke="#f6f1e6" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="170" y="515" fill="#f6f1e6" opacity="0.9">Deployment automation</text>
    <text x="170" y="541" fill="#f6f1e6" opacity="0.55" font-size="12">platform/MLOps team · owns rollout, rollback, canary</text>
    <text x="1050" y="528" fill="#f6f1e6" opacity="0.5" font-size="12">hands off &#8594; a live endpoint</text>

    <rect x="140" y="620" width="1320" height="120" fill="#f4d44d" fill-opacity="0.12" stroke="#f4d44d" stroke-width="2"/>
    <text x="170" y="665" fill="#f4d44d" font-weight="bold">Production monitoring</text>
    <text x="170" y="691" fill="#f4d44d" opacity="0.85" font-size="12">observability/on-call · owns traces, evals, drift, incidents</text>
  </g>

  <line x1="800" y1="740" x2="800" y2="800" stroke="#f4d44d" stroke-width="2"/>
  <path d="M800 800 C 400 800, 200 500, 200 290" stroke="#f4d44d" stroke-width="2" fill="none" stroke-dasharray="4 6"/>
  <polygon points="200,290 188,315 212,315" fill="#f4d44d"/>
  <text x="220" y="800" fill="#f4d44d" font-family="monospace" font-size="12" opacity="0.85">a production finding reopens the experiment row: retraining loop</text>
</svg>
