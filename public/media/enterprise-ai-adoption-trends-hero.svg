<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="eaatHeroTitle eaatHeroDesc">
  <title id="eaatHeroTitle">A control tower reviewing three lanes of AI agent requests before they reach production, with only the approved lane continuing through</title>
  <desc id="eaatHeroDesc">An illustration of three converging lanes labeled pilot, department rollout, and vendor integration, each carrying small agent icons toward a raised control tower. The tower has three checkpoint lights: budget, policy, and reliability. Two lanes are stopped at a barrier with a queued sign, and one lane continues past the tower into a lit production zone labeled shipped with owner. A ledger panel beside the tower totals spend and incident counts for the quarter.</desc>
  <rect width="1600" height="900" fill="#0a0a0a"/>
  <text x="90" y="66" fill="#f4d44d" font-family="monospace" font-size="20" letter-spacing="2">ENTERPRISE AI ADOPTION</text>
  <text x="90" y="94" fill="#f6f1e6" font-family="monospace" font-size="14" opacity="0.6">three lanes of agent work, one control tower, one lit exit</text>

  <!-- lanes -->
  <g font-family="monospace" font-size="13">
    <rect x="90" y="150" width="520" height="70" fill="none" stroke="#f6f1e6" stroke-opacity="0.25" stroke-width="1.5"/>
    <text x="106" y="192" fill="#f6f1e6" opacity="0.7">PILOT &#183; single team, sandbox data</text>

    <rect x="90" y="240" width="520" height="70" fill="none" stroke="#f6f1e6" stroke-opacity="0.25" stroke-width="1.5"/>
    <text x="106" y="282" fill="#f6f1e6" opacity="0.7">DEPARTMENT ROLLOUT &#183; shared tools, real customers</text>

    <rect x="90" y="330" width="520" height="70" fill="none" stroke="#f6f1e6" stroke-opacity="0.25" stroke-width="1.5"/>
    <text x="106" y="372" fill="#f6f1e6" opacity="0.7">VENDOR INTEGRATION &#183; embedded agent, external contract</text>
  </g>

  <!-- lane paths to tower -->
  <path d="M610 185 C 780 185, 820 300, 960 340" fill="none" stroke="#7fbf7f" stroke-width="2.5"/>
  <path d="M610 275 C 780 275, 820 320, 960 360" fill="none" stroke="#e2694f" stroke-width="2.5" stroke-dasharray="6,6"/>
  <path d="M610 365 C 780 365, 820 350, 960 380" fill="none" stroke="#e2694f" stroke-width="2.5" stroke-dasharray="6,6"/>

  <!-- control tower -->
  <rect x="960" y="220" width="220" height="300" fill="#f6f1e6" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="1070" y="256" text-anchor="middle" fill="#1a1a1a" font-family="monospace" font-size="13" font-weight="bold">CONTROL TOWER</text>
  <g font-family="monospace" font-size="12">
    <circle cx="985" cy="300" r="8" fill="#7fbf7f"/>
    <text x="1005" y="305" fill="#1a1a1a">budget within band</text>
    <circle cx="985" cy="335" r="8" fill="#7fbf7f"/>
    <text x="1005" y="340" fill="#1a1a1a">policy checks pass</text>
    <circle cx="985" cy="370" r="8" fill="#e2694f"/>
    <text x="1005" y="375" fill="#1a1a1a">reliability evidence</text>
    <text x="1005" y="390" fill="#1a1a1a" opacity="0.5" font-size="10">missing for 2 lanes</text>
  </g>
  <rect x="985" y="430" width="180" height="70" fill="none" stroke="#1a1a1a" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="1000" y="452" fill="#1a1a1a" font-size="11" opacity="0.6">Q SPEND</text>
  <text x="1000" y="474" fill="#1a1a1a" font-size="14" font-weight="bold">under band</text>
  <text x="1000" y="492" fill="#1a1a1a" font-size="11" opacity="0.6">INCIDENTS 1</text>

  <!-- barrier for two lanes -->
  <g>
    <rect x="1220" y="330" width="14" height="140" fill="#e2694f"/>
    <text x="1200" y="500" text-anchor="middle" fill="#e2694f" font-family="monospace" font-size="12" font-weight="bold">QUEUED</text>
    <text x="1200" y="518" text-anchor="middle" fill="#e2694f" font-family="monospace" font-size="10" opacity="0.8">evidence requested</text>
  </g>

  <!-- lit exit for approved lane -->
  <path d="M1180 340 C 1260 320, 1300 300, 1360 260" fill="none" stroke="#7fbf7f" stroke-width="3"/>
  <polygon points="1352,268 1378,252 1368,278" fill="#7fbf7f"/>
  <rect x="1380" y="150" width="150" height="220" fill="#123322" stroke="#7fbf7f" stroke-width="2"/>
  <text x="1455" y="185" text-anchor="middle" fill="#7fbf7f" font-family="monospace" font-size="13" font-weight="bold">SHIPPED</text>
  <text x="1455" y="205" text-anchor="middle" fill="#7fbf7f" font-family="monospace" font-size="11">with named owner</text>
  <text x="1455" y="240" text-anchor="middle" fill="#f6f1e6" font-family="monospace" font-size="10" opacity="0.6">on-call assigned</text>
  <text x="1455" y="260" text-anchor="middle" fill="#f6f1e6" font-family="monospace" font-size="10" opacity="0.6">rollback path tested</text>
  <text x="1455" y="280" text-anchor="middle" fill="#f6f1e6" font-family="monospace" font-size="10" opacity="0.6">budget alert wired</text>

  <text x="1500" y="855" fill="#f6f1e6" font-family="monospace" font-size="13" opacity="0.45" text-anchor="end">the tower does not block ambition, it blocks unowned risk</text>
</svg>
