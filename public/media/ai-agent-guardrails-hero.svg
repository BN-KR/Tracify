<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="grTitle grDesc">
  <title id="grTitle">One attempted action passing through seven layered guardrail bands</title>
  <desc id="grDesc">A black canvas shows seven concentric rectangular bands labeled input, context, output, authorization, limits, approval, and audit, nested inside each other, with a single vertical arrow representing one attempted action passing through several bands before reaching a box labeled EXECUTED at the center.</desc>
  <rect width="1600" height="900" fill="#0a0a0a"/>
  <text x="100" y="90" fill="#f4d44d" font-family="monospace" font-size="20" letter-spacing="2">AI AGENT GUARDRAILS</text>
  <text x="100" y="122" fill="#f6f1e6" font-family="monospace" font-size="14" opacity="0.6">seven-layer model</text>

  <g font-family="monospace" font-size="12" fill="#f6f1e6" stroke="#f6f1e6">
    <rect x="440" y="170" width="720" height="620" fill="none" stroke-opacity="0.18"/>
    <text x="460" y="192" opacity="0.55">INPUT</text>
    <rect x="480" y="210" width="640" height="540" fill="none" stroke-opacity="0.22"/>
    <text x="500" y="232" opacity="0.55">CONTEXT</text>
    <rect x="520" y="250" width="560" height="460" fill="none" stroke-opacity="0.26"/>
    <text x="540" y="272" opacity="0.6">OUTPUT</text>
    <rect x="560" y="290" width="480" height="380" fill="none" stroke-opacity="0.3"/>
    <text x="580" y="312" opacity="0.6">AUTHORIZATION</text>
    <rect x="600" y="330" width="400" height="300" fill="none" stroke-opacity="0.35"/>
    <text x="620" y="352" opacity="0.65">RUNTIME LIMITS</text>
    <rect x="640" y="370" width="320" height="220" fill="none" stroke-opacity="0.4"/>
    <text x="660" y="392" opacity="0.7">HUMAN APPROVAL</text>
    <rect x="680" y="410" width="240" height="140" fill="none" stroke="#f4d44d" stroke-opacity="0.8"/>
    <text x="700" y="432" fill="#f4d44d">AUDIT</text>
  </g>

  <rect x="760" y="450" width="80" height="60" fill="#f4d44d" fill-opacity="0.9"/>
  <text x="800" y="486" fill="#0a0a0a" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold">RUN</text>

  <line x1="800" y1="170" x2="800" y2="450" stroke="#f4d44d" stroke-width="2" stroke-dasharray="4 6"/>
  <text x="820" y="150" fill="#f4d44d" font-family="monospace" font-size="12">one attempted action</text>

  <text x="100" y="850" fill="#f6f1e6" font-family="monospace" font-size="13" opacity="0.45">no single layer is sufficient alone — they are meant to compose</text>
</svg>
