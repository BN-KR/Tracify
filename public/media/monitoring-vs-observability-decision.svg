<svg viewBox="0 0 1600 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mvoDecisionTitle mvoDecisionDesc">
  <title id="mvoDecisionTitle">A decision path from an alert firing to a root cause, showing where monitoring stops and observability continues</title>
  <desc id="mvoDecisionDesc">A black canvas shows a horizontal path of five cream nodes connected by yellow arrows: ALERT FIRES, KNOWN DASHBOARD CHECKED, DASHBOARD RUNS OUT, ASK A NEW QUESTION, ROOT CAUSE FOUND. A dividing line under the third node is labeled MONITORING STOPS HERE, and the remaining two nodes sit under a label reading OBSERVABILITY TAKES OVER, showing that monitoring detects a problem but observability is what explains it.</desc>
  <rect width="1600" height="720" fill="#0a0a0a"/>
  <text x="800" y="70" text-anchor="middle" fill="#f4d44d" font-family="monospace" font-size="20" letter-spacing="2">WHERE MONITORING RUNS OUT OF ANSWERS</text>

  <g font-family="monospace" font-size="15">
    <!-- nodes -->
    <g transform="translate(80,280)">
      <rect width="230" height="130" fill="#f6f1e6"/>
      <text x="115" y="55" text-anchor="middle" fill="#0a0a0a" font-weight="700">ALERT FIRES</text>
      <text x="115" y="85" text-anchor="middle" fill="#0a0a0a" opacity="0.7">error rate spike</text>
    </g>
    <g transform="translate(390,280)">
      <rect width="250" height="130" fill="#f6f1e6"/>
      <text x="125" y="45" text-anchor="middle" fill="#0a0a0a" font-weight="700">KNOWN DASHBOARD</text>
      <text x="125" y="70" text-anchor="middle" fill="#0a0a0a" font-weight="700">CHECKED</text>
      <text x="125" y="100" text-anchor="middle" fill="#0a0a0a" opacity="0.7">matches a pre-built view</text>
    </g>
    <g transform="translate(720,280)">
      <rect width="230" height="130" fill="#f6f1e6"/>
      <text x="115" y="45" text-anchor="middle" fill="#0a0a0a" font-weight="700">DASHBOARD RUNS</text>
      <text x="115" y="70" text-anchor="middle" fill="#0a0a0a" font-weight="700">OUT</text>
      <text x="115" y="100" text-anchor="middle" fill="#0a0a0a" opacity="0.7">no pre-built view fits</text>
    </g>
    <g transform="translate(1030,280)">
      <rect width="230" height="130" fill="#f4d44d"/>
      <text x="115" y="45" text-anchor="middle" fill="#0a0a0a" font-weight="700">ASK A NEW</text>
      <text x="115" y="70" text-anchor="middle" fill="#0a0a0a" font-weight="700">QUESTION</text>
      <text x="115" y="100" text-anchor="middle" fill="#0a0a0a" opacity="0.75">query raw trace data</text>
    </g>
    <g transform="translate(1330,280)">
      <rect width="190" height="130" fill="#f4d44d"/>
      <text x="95" y="55" text-anchor="middle" fill="#0a0a0a" font-weight="700">ROOT CAUSE</text>
      <text x="95" y="80" text-anchor="middle" fill="#0a0a0a" font-weight="700">FOUND</text>
    </g>

    <!-- arrows -->
    <path d="M310 345 L385 345" stroke="#f4d44d" stroke-width="5" fill="none"/>
    <path d="M640 345 L715 345" stroke="#f4d44d" stroke-width="5" fill="none"/>
    <path d="M950 345 L1025 345" stroke="#f4d44d" stroke-width="5" fill="none"/>
    <path d="M1260 345 L1325 345" stroke="#f4d44d" stroke-width="5" fill="none"/>
  </g>

  <line x1="720" y1="460" x2="720" y2="560" stroke="#f6f1e6" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="400" y="600" text-anchor="middle" fill="#f6f1e6" font-family="monospace" font-size="16" opacity="0.7">MONITORING STOPS HERE</text>
  <text x="1220" y="600" text-anchor="middle" fill="#f4d44d" font-family="monospace" font-size="16" opacity="0.85">OBSERVABILITY TAKES OVER</text>
</svg>
