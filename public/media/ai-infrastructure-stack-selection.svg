<svg viewBox="0 0 1600 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="selTitle selDesc">
  <title id="selTitle">A decision tree for choosing a model serving path based on latency and volume</title>
  <desc id="selDesc">A black canvas shows a branching decision tree starting at a box labeled NEW WORKLOAD, splitting into three paths based on request volume and latency needs: a managed API path, a self-hosted GPU path, and a hybrid gateway path, each ending in a labeled outcome box.</desc>
  <rect width="1600" height="800" fill="#0a0a0a"/>
  <text x="90" y="80" fill="#f4d44d" font-family="monospace" font-size="18" letter-spacing="1.5">CHOOSING A SERVING PATH</text>

  <g font-family="monospace" font-size="13" fill="#f6f1e6">
    <rect x="650" y="120" width="300" height="60" fill="none" stroke="#f4d44d" stroke-opacity="0.85"/>
    <text x="800" y="156" text-anchor="middle" fill="#f4d44d">NEW WORKLOAD</text>

    <line x1="800" y1="180" x2="300" y2="280" stroke="#f6f1e6" stroke-opacity="0.4"/>
    <line x1="800" y1="180" x2="800" y2="280" stroke="#f6f1e6" stroke-opacity="0.4"/>
    <line x1="800" y1="180" x2="1300" y2="280" stroke="#f6f1e6" stroke-opacity="0.4"/>

    <rect x="140" y="280" width="330" height="70" fill="none" stroke="#f6f1e6" stroke-opacity="0.35"/>
    <text x="305" y="308" text-anchor="middle" opacity="0.85">Low/variable volume,</text>
    <text x="305" y="328" text-anchor="middle" opacity="0.85">latency tolerant</text>

    <rect x="635" y="280" width="330" height="70" fill="none" stroke="#f6f1e6" stroke-opacity="0.35"/>
    <text x="800" y="308" text-anchor="middle" opacity="0.85">Steady high volume,</text>
    <text x="800" y="328" text-anchor="middle" opacity="0.85">strict latency budget</text>

    <rect x="1130" y="280" width="330" height="70" fill="none" stroke="#f6f1e6" stroke-opacity="0.35"/>
    <text x="1295" y="308" text-anchor="middle" opacity="0.85">Mixed workloads,</text>
    <text x="1295" y="328" text-anchor="middle" opacity="0.85">multiple providers</text>

    <line x1="305" y1="350" x2="305" y2="420" stroke="#f6f1e6" stroke-opacity="0.4"/>
    <line x1="800" y1="350" x2="800" y2="420" stroke="#f6f1e6" stroke-opacity="0.4"/>
    <line x1="1295" y1="350" x2="1295" y2="420" stroke="#f6f1e6" stroke-opacity="0.4"/>

    <rect x="140" y="420" width="330" height="80" fill="none" stroke="#f4d44d" stroke-opacity="0.7"/>
    <text x="305" y="452" text-anchor="middle" fill="#f4d44d">MANAGED API</text>
    <text x="305" y="474" text-anchor="middle" opacity="0.7" font-size="11">pay per token, no GPU ops</text>

    <rect x="635" y="420" width="330" height="80" fill="none" stroke="#f4d44d" stroke-opacity="0.7"/>
    <text x="800" y="452" text-anchor="middle" fill="#f4d44d">SELF-HOSTED GPU</text>
    <text x="800" y="474" text-anchor="middle" opacity="0.7" font-size="11">fixed cost, full control</text>

    <rect x="1130" y="420" width="330" height="80" fill="none" stroke="#f4d44d" stroke-opacity="0.7"/>
    <text x="1295" y="452" text-anchor="middle" fill="#f4d44d">GATEWAY + ROUTING</text>
    <text x="1295" y="474" text-anchor="middle" opacity="0.7" font-size="11">policy picks the backend</text>
  </g>

  <text x="90" y="620" fill="#f6f1e6" font-family="monospace" font-size="13" opacity="0.45">volume and latency drive the first decision; cost and control refine it</text>
</svg>
