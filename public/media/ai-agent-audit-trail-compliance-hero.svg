<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="aatHeroTitle aatHeroDesc">
  <title id="aatHeroTitle">An exhibit folder holding a printed run record with two redacted data fields, a wax evidence seal, and a chain-of-custody tag, pulled by a GDPR access request</title>
  <desc id="aatHeroDesc">An illustration of a manila case folder labeled EXHIBIT 8A13 containing a printed record with five fields: actor, action, data touched, basis, and disposition. The data-touched field has two black redaction bars over it. A circular wax seal stamped SEALED AND HASHED sits on the corner of the folder, and a tag on a string reads chain of custody, three accesses logged. An arrow labeled GDPR Article 15 request points into the folder, showing the access request is answered from this sealed record rather than reconstructed from memory.</desc>
  <rect width="1600" height="900" fill="#0a0a0a"/>
  <text x="90" y="66" fill="#f4d44d" font-family="monospace" font-size="20" letter-spacing="2">AI AGENT AUDIT TRAIL</text>
  <text x="90" y="94" fill="#f6f1e6" font-family="monospace" font-size="14" opacity="0.6">actor &#183; action &#183; data &#183; basis &#183; disposition, sealed as one exhibit</text>

  <!-- folder tab -->
  <path d="M330,140 h220 l24,34 h-244 z" fill="#e7dfc9" stroke="#1a1a1a" stroke-width="2"/>
  <text x="440" y="164" text-anchor="middle" fill="#1a1a1a" font-family="monospace" font-size="12" font-weight="bold">EXHIBIT 8A13</text>

  <!-- folder body -->
  <rect x="330" y="174" width="820" height="600" fill="#f6f1e6" stroke="#1a1a1a" stroke-width="2.5"/>

  <g font-family="monospace" font-size="14">
    <text x="365" y="225" fill="#1a1a1a" opacity="0.55" font-size="11">ACTOR</text>
    <text x="365" y="250" fill="#1a1a1a">svc_billing-agent acting for user_4471, session_9c2</text>
    <line x1="365" y1="268" x2="1115" y2="268" stroke="#1a1a1a" stroke-opacity="0.2"/>

    <text x="365" y="300" fill="#1a1a1a" opacity="0.55" font-size="11">ACTION</text>
    <text x="365" y="325" fill="#1a1a1a">waive_late_fee &#183; amount 34.00 usd &#183; tool v3</text>
    <line x1="365" y1="343" x2="1115" y2="343" stroke="#1a1a1a" stroke-opacity="0.2"/>

    <text x="365" y="375" fill="#1a1a1a" opacity="0.55" font-size="11">DATA TOUCHED</text>
    <rect x="365" y="390" width="330" height="24" fill="#1a1a1a"/>
    <rect x="365" y="420" width="230" height="24" fill="#1a1a1a"/>
    <text x="705" y="408" fill="#1a1a1a" opacity="0.45" font-size="11">redacted after 90 days</text>
    <line x1="365" y1="453" x2="1115" y2="453" stroke="#1a1a1a" stroke-opacity="0.2"/>

    <text x="365" y="485" fill="#1a1a1a" opacity="0.55" font-size="11">BASIS</text>
    <text x="365" y="510" fill="#1a1a1a">policy fee-waiver-v6, tenure &#8805; 18mo, first dispute</text>
    <line x1="365" y1="528" x2="1115" y2="528" stroke="#1a1a1a" stroke-opacity="0.2"/>

    <text x="365" y="560" fill="#1a1a1a" opacity="0.55" font-size="11">DISPOSITION</text>
    <text x="365" y="585" fill="#1a1a1a">auto-approved, no human override, hash sealed 03:12</text>
  </g>

  <!-- chain of custody tag -->
  <line x1="1150" y1="220" x2="1220" y2="270" stroke="#1a1a1a" stroke-width="1.5"/>
  <g transform="rotate(18 1260 310)">
    <rect x="1200" y="270" width="180" height="90" rx="6" fill="#f6f1e6" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="1220" cy="290" r="5" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <text x="1290" y="305" text-anchor="middle" fill="#1a1a1a" font-family="monospace" font-size="11" font-weight="bold">CHAIN OF CUSTODY</text>
    <text x="1290" y="325" text-anchor="middle" fill="#1a1a1a" font-family="monospace" font-size="10">3 accesses logged</text>
    <text x="1290" y="343" text-anchor="middle" fill="#1a1a1a" font-family="monospace" font-size="10">0 edits</text>
  </g>

  <!-- wax seal -->
  <circle cx="1140" cy="700" r="70" fill="#8a1f1f" stroke="#e2694f" stroke-width="3"/>
  <circle cx="1140" cy="700" r="52" fill="none" stroke="#f6f1e6" stroke-width="2" stroke-dasharray="3,4"/>
  <text x="1140" y="690" text-anchor="middle" fill="#f6f1e6" font-family="monospace" font-size="12" font-weight="bold">SEALED</text>
  <text x="1140" y="710" text-anchor="middle" fill="#f6f1e6" font-family="monospace" font-size="12" font-weight="bold">&amp; HASHED</text>

  <!-- GDPR request arrow -->
  <path d="M120 800 C 220 760, 260 700, 320 640" fill="none" stroke="#7fbf7f" stroke-width="2.5" stroke-dasharray="2,0"/>
  <polygon points="312,650 335,635 320,660" fill="#7fbf7f"/>
  <text x="110" y="825" fill="#7fbf7f" font-family="monospace" font-size="14" font-weight="bold">GDPR Art. 15 request</text>
  <text x="110" y="847" fill="#7fbf7f" font-family="monospace" font-size="12" opacity="0.8">&#8220;what did the agent do with my data?&#8221;</text>

  <text x="1330" y="855" fill="#f6f1e6" font-family="monospace" font-size="13" opacity="0.45" text-anchor="end">the answer comes from the sealed exhibit, not from memory</text>
</svg>
