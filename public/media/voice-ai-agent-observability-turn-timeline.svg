<svg viewBox="0 0 1600 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vaTimelineTitle vaTimelineDesc">
  <title id="vaTimelineTitle">A single voice turn broken into stage latencies on a shared timeline, from end of user speech to first audio played back</title>
  <desc id="vaTimelineDesc">A black canvas shows a horizontal timeline in milliseconds with five stacked bars representing one voice turn: endpoint detection, ASR finalization, LLM time to first token, TTS time to first audio byte, and network playback delay. A yellow marker labeled "user hears the agent" sits at the end of the bars, and a bracket above the whole row is labeled "turn latency budget," showing how each stage consumes part of the same budget.</desc>
  <rect width="1600" height="700" fill="#0a0a0a"/>
  <text x="80" y="70" fill="#f4d44d" font-family="monospace" font-size="18" letter-spacing="1">ONE TURN, FIVE LATENCIES</text>
  <text x="80" y="98" fill="#f6f1e6" font-family="monospace" font-size="13" opacity="0.6">measured from end-of-speech to first audible response</text>

  <g font-family="monospace" font-size="13">
    <!-- axis -->
    <line x1="360" y1="600" x2="1520" y2="600" stroke="#f6f1e6" stroke-opacity="0.35"/>
    <text x="360" y="622" fill="#f6f1e6" opacity="0.45" font-size="11">0 ms</text>
    <text x="1500" y="622" fill="#f6f1e6" opacity="0.45" font-size="11">2000 ms</text>

    <!-- bracket -->
    <path d="M360 150 L360 130 L1520 130 L1520 150" fill="none" stroke="#f4d44d" stroke-opacity="0.6" stroke-width="1.5"/>
    <text x="940" y="118" fill="#f4d44d" text-anchor="middle" font-size="13">turn latency budget</text>

    <!-- rows -->
    <text x="80" y="205" fill="#f6f1e6" opacity="0.75">endpoint detect</text>
    <rect x="360" y="180" width="90" height="40" fill="none" stroke="#f6f1e6" stroke-opacity="0.6"/>
    <text x="405" y="205" fill="#f6f1e6" text-anchor="middle" font-size="11" opacity="0.7">150ms</text>

    <text x="80" y="275" fill="#f6f1e6" opacity="0.75">ASR finalize</text>
    <rect x="450" y="250" width="180" height="40" fill="none" stroke="#f6f1e6" stroke-opacity="0.6"/>
    <text x="540" y="275" fill="#f6f1e6" text-anchor="middle" font-size="11" opacity="0.7">300ms</text>

    <text x="80" y="345" fill="#f6f1e6" opacity="0.75">LLM first token</text>
    <rect x="630" y="320" width="420" height="40" fill="#f4d44d" fill-opacity="0.14" stroke="#f4d44d" stroke-opacity="0.8"/>
    <text x="840" y="345" fill="#f4d44d" text-anchor="middle" font-size="11">700ms</text>

    <text x="80" y="415" fill="#f6f1e6" opacity="0.75">TTS first byte</text>
    <rect x="1050" y="390" width="240" height="40" fill="none" stroke="#f6f1e6" stroke-opacity="0.6"/>
    <text x="1170" y="415" fill="#f6f1e6" text-anchor="middle" font-size="11" opacity="0.7">400ms</text>

    <text x="80" y="485" fill="#f6f1e6" opacity="0.75">network + jitter</text>
    <rect x="1290" y="460" width="120" height="40" fill="none" stroke="#f6f1e6" stroke-opacity="0.6"/>
    <text x="1350" y="485" fill="#f6f1e6" text-anchor="middle" font-size="11" opacity="0.7">180ms</text>

    <!-- marker -->
    <line x1="1410" y1="150" x2="1410" y2="600" stroke="#f4d44d" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="1420" y="560" fill="#f4d44d" font-size="13">user hears the agent</text>
    <text x="1420" y="580" fill="#f4d44d" opacity="0.7" font-size="12">~1730ms total</text>
  </g>

  <text x="80" y="660" fill="#f6f1e6" font-family="monospace" font-size="13" opacity="0.45">time-to-first-audio-byte is the sum of every stage before it, not one span in isolation</text>
</svg>
