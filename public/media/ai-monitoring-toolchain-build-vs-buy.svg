<svg viewBox="0 0 1600 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bvbTitle bvbDesc">
  <title id="bvbTitle">A five-row build-versus-buy spectrum for each monitoring layer</title>
  <desc id="bvbDesc">A black canvas shows five horizontal bars, one per monitoring layer, each with a marker positioned along a spectrum from BUILD on the left in cream to BUY on the right in acid yellow, showing that capture leans toward open standards while scoring and watching lean toward bought tooling.</desc>
  <rect width="1600" height="760" fill="#0a0a0a"/>
  <text x="800" y="60" text-anchor="middle" fill="#f4d44d" font-family="monospace" font-size="20" letter-spacing="2">BUILD-VS-BUY BY LAYER</text>

  <g font-family="monospace" font-size="16" fill="#f6f1e6">
    <text x="140" y="110">BUILD</text>
    <text x="1400" y="110" fill="#f4d44d">BUY</text>
  </g>

  <g font-family="monospace" font-size="16">
    <!-- Capture -->
    <text x="120" y="185" fill="#f6f1e6">CAPTURE</text>
    <rect x="300" y="165" width="1100" height="10" fill="#3a3a3a"/>
    <circle cx="560" cy="170" r="14" fill="#f6f1e6"/>

    <!-- Score -->
    <text x="120" y="285" fill="#f6f1e6">SCORE</text>
    <rect x="300" y="265" width="1100" height="10" fill="#3a3a3a"/>
    <circle cx="1020" cy="270" r="14" fill="#f4d44d"/>

    <!-- Price -->
    <text x="120" y="385" fill="#f6f1e6">PRICE</text>
    <rect x="300" y="365" width="1100" height="10" fill="#3a3a3a"/>
    <circle cx="760" cy="370" r="14" fill="#f6f1e6"/>

    <!-- Watch -->
    <text x="120" y="485" fill="#f6f1e6">WATCH</text>
    <rect x="300" y="465" width="1100" height="10" fill="#3a3a3a"/>
    <circle cx="1120" cy="470" r="14" fill="#f4d44d"/>

    <!-- Route -->
    <text x="120" y="585" fill="#f6f1e6">ROUTE</text>
    <rect x="300" y="565" width="1100" height="10" fill="#3a3a3a"/>
    <circle cx="880" cy="570" r="14" fill="#f6f1e6"/>
  </g>

  <text x="800" y="690" text-anchor="middle" fill="#8a8a8a" font-family="monospace" font-size="14">Marker position reflects typical team practice, not a fixed rule</text>
</svg>
