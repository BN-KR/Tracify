<svg viewBox="0 0 1600 820" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="idBreakTitle idBreakDesc">
  <title id="idBreakTitle">A shared run identifier passing cleanly between three tools, then breaking at a fourth</title>
  <desc id="idBreakDesc">A black canvas shows a cream run identifier token flowing left to right through three acid-yellow boxes labeled tracing, evals, and cost, connected by solid lines, then a broken dashed line into a fourth box labeled alerting where the identifier is shown crossed out, illustrating where an assembled toolchain commonly loses correlation.</desc>
  <rect width="1600" height="820" fill="#0a0a0a"/>
  <text x="800" y="64" text-anchor="middle" fill="#f4d44d" font-family="monospace" font-size="20" letter-spacing="2">WHERE THE RUN ID BREAKS</text>

  <g font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">
    <rect x="60" y="380" width="220" height="70" fill="#f6f1e6"/>
    <text x="170" y="422" fill="#0a0a0a">run_id: 9f21</text>

    <line x1="280" y1="415" x2="440" y2="415" stroke="#f4d44d" stroke-width="3"/>
    <rect x="440" y="200" width="260" height="70" fill="#f4d44d"/>
    <text x="570" y="242" fill="#0a0a0a">TRACING</text>

    <line x1="440" y1="415" x2="700" y2="415" stroke="#f4d44d" stroke-width="3"/>
    <rect x="700" y="380" width="260" height="70" fill="#f4d44d"/>
    <text x="830" y="422" fill="#0a0a0a">EVALS</text>

    <line x1="700" y1="415" x2="960" y2="415" stroke="#f4d44d" stroke-width="3"/>
    <rect x="960" y="560" width="260" height="70" fill="#f4d44d"/>
    <text x="1090" y="602" fill="#0a0a0a">COST</text>

    <line x1="960" y1="415" x2="1260" y2="415" stroke="#f4d44d" stroke-width="3" stroke-dasharray="10 10"/>
    <rect x="1260" y="380" width="260" height="70" fill="#3a3a3a"/>
    <text x="1390" y="422" fill="#f6f1e6">ALERTING</text>
    <text x="1390" y="480" fill="#f4d44d" font-size="14">run_id: missing</text>
  </g>

  <text x="800" y="740" text-anchor="middle" fill="#8a8a8a" font-family="monospace" font-size="14">An alert with no run id sends an operator back to manual log correlation during an incident</text>
</svg>
