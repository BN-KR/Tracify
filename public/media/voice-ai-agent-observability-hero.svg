<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vaHeroTitle vaHeroDesc">
  <title id="vaHeroTitle">One continuous audio timeline showing real waveform during capture and play, but dead silence during interpret and synthesize, with a barge-in waveform overlapping the agent near the end</title>
  <desc id="vaHeroDesc">An illustration of a single audio timeline. A jagged user waveform plays during the capture and recognize zones. The interpret and synthesize zones show a flat silent line with a thinking indicator, because no audio exists yet while the model reasons and the voice is synthesized. A yellow agent waveform then plays during the play zone. Near the end of the agent's waveform, a second user waveform starts underneath and overlaps it in a shaded red region labeled barge-in, showing the moment the user started talking over the agent.</desc>
  <rect width="1600" height="900" fill="#0a0a0a"/>
  <text x="90" y="66" fill="#f4d44d" font-family="monospace" font-size="20" letter-spacing="2">VOICE AI AGENT OBSERVABILITY</text>
  <text x="90" y="94" fill="#f6f1e6" font-family="monospace" font-size="14" opacity="0.6">one timeline, real audio in two zones, dead silence in two more</text>

  <!-- baseline -->
  <line x1="120" y1="380" x2="1480" y2="380" stroke="#f6f1e6" stroke-opacity="0.2" stroke-width="1"/>

  <!-- zone 1+2: user waveform (capture + recognize) -->
  <path d="M120,380 L140,380 L152,320 L164,430 L176,300 L188,440 L200,340 L212,410 L224,360 L236,400
           L260,380 L272,330 L284,420 L296,310 L308,435 L320,345 L332,405 L344,365 L356,395
           L380,380 L392,335 L404,415 L416,320 L428,425 L440,350 L452,400 L464,370 L476,390 L500,380"
    fill="none" stroke="#f6f1e6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- ASR partial-transcript ticks above zone 2 -->
  <g fill="#f6f1e6" opacity="0.5">
    <rect x="378" y="300" width="4" height="14"/><rect x="398" y="296" width="4" height="18"/>
    <rect x="418" y="302" width="4" height="12"/><rect x="438" y="298" width="4" height="16"/><rect x="458" y="303" width="4" height="11"/>
  </g>

  <!-- zone 3: interpret, silence + thinking indicator -->
  <line x1="520" y1="380" x2="800" y2="380" stroke="#f6f1e6" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="620" cy="380" r="6" fill="#f4d44d"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" repeatCount="indefinite"/></circle>
  <circle cx="650" cy="380" r="6" fill="#f4d44d"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0.2s" repeatCount="indefinite"/></circle>
  <circle cx="680" cy="380" r="6" fill="#f4d44d"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0.4s" repeatCount="indefinite"/></circle>
  <text x="660" y="330" text-anchor="middle" fill="#f4d44d" font-family="monospace" font-size="11" opacity="0.85">no audio &#8212; model reasoning</text>

  <!-- zone 4: synthesize, silence + progress arc -->
  <line x1="820" y1="380" x2="1080" y2="380" stroke="#f6f1e6" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="950" cy="380" r="22" fill="none" stroke="#f6f1e6" stroke-opacity="0.4" stroke-width="3"/>
  <path d="M950,358 A22,22 0 0 1 969,391" fill="none" stroke="#f4d44d" stroke-width="3"/>
  <text x="950" y="330" text-anchor="middle" fill="#f4d44d" font-family="monospace" font-size="11" opacity="0.85">no audio &#8212; voice rendering</text>

  <!-- zone 5: agent waveform (play) -->
  <path d="M1100,380 L1112,380 L1124,320 L1136,430 L1148,300 L1160,440 L1172,340 L1184,410 L1196,360 L1208,400
           L1232,380 L1244,320 L1256,435 L1268,305 L1280,440 L1292,345 L1304,405 L1316,365 L1328,395
           L1352,380 L1364,325 L1376,425 L1388,310 L1400,435 L1412,345 L1424,400 L1436,370 L1448,390 L1460,380"
    fill="none" stroke="#f4d44d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- zone dividers + labels -->
  <g font-family="monospace" font-size="12" fill="#f6f1e6">
    <line x1="120" y1="440" x2="120" y2="460" stroke="#f6f1e6" stroke-opacity="0.3"/>
    <text x="300" y="480" text-anchor="middle" opacity="0.7">CAPTURE</text>
    <line x1="520" y1="440" x2="520" y2="460" stroke="#f6f1e6" stroke-opacity="0.3"/>
    <text x="500" y="480" text-anchor="middle" opacity="0.7">RECOGNIZE</text>
    <line x1="800" y1="440" x2="800" y2="460" stroke="#f4d44d" stroke-opacity="0.5"/>
    <text x="660" y="500" text-anchor="middle" fill="#f4d44d" font-weight="bold">INTERPRET</text>
    <line x1="1080" y1="440" x2="1080" y2="460" stroke="#f6f1e6" stroke-opacity="0.3"/>
    <text x="950" y="480" text-anchor="middle" opacity="0.7">SYNTHESIZE</text>
    <line x1="1480" y1="440" x2="1480" y2="460" stroke="#f6f1e6" stroke-opacity="0.3"/>
    <text x="1280" y="480" text-anchor="middle" fill="#f4d44d">PLAY</text>
  </g>

  <!-- barge-in: second user waveform overlapping the agent near the end -->
  <path d="M1330,620 L1342,620 L1352,590 L1362,650 L1372,580 L1382,655 L1392,600 L1402,640 L1412,610 L1422,630 L1440,620"
    fill="none" stroke="#7fbf7f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1330" y="330" width="150" height="330" fill="#e2694f" fill-opacity="0.14" stroke="#e2694f" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="1405" y="700" text-anchor="middle" fill="#e2694f" font-family="monospace" font-size="13" font-weight="bold">BARGE-IN</text>
  <text x="1405" y="720" text-anchor="middle" fill="#e2694f" font-family="monospace" font-size="11" opacity="0.85">user talks, agent audio keeps going</text>
  <text x="1150" y="620" fill="#7fbf7f" font-family="monospace" font-size="12" opacity="0.85">user audio in, again</text>

  <text x="90" y="810" fill="#f6f1e6" font-family="monospace" font-size="13" opacity="0.5">two zones have no audio at all &#8212; a trace that only timestamps sound misses where the time actually goes</text>
</svg>
