<svg viewBox="0 0 1600 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="aatAnatomyTitle aatAnatomyDesc">
  <title id="aatAnatomyTitle">When each of the five audit-record fields is captured during a single agent run</title>
  <desc id="aatAnatomyDesc">A black canvas shows six run stages across the top — request, auth, tool call, policy check, execution, and completion — connected by a horizontal line. Below, five rows for actor, action, data touched, basis, and disposition each show a marker under the stage where that field is written, illustrating that the record is assembled incrementally rather than written once at the end.</desc>
  <rect width="1600" height="620" fill="#0a0a0a"/>
  <text x="80" y="60" fill="#f4d44d" font-family="monospace" font-size="18" letter-spacing="1.5">WHEN EACH FIELD IS CAPTURED</text>
  <text x="80" y="88" fill="#f6f1e6" font-family="monospace" font-size="13" opacity="0.55">a record assembled across the run, not written once at the end</text>

  <line x1="150" y1="140" x2="1450" y2="140" stroke="#f6f1e6" stroke-opacity="0.35" stroke-width="1.5"/>
  <g font-family="monospace" font-size="12" fill="#f6f1e6">
    <circle cx="150" cy="140" r="5" fill="#f6f1e6" opacity="0.6"/>
    <text x="150" y="120" text-anchor="middle" opacity="0.65">REQUEST</text>
    <circle cx="410" cy="140" r="5" fill="#f6f1e6" opacity="0.6"/>
    <text x="410" y="120" text-anchor="middle" opacity="0.65">AUTH</text>
    <circle cx="670" cy="140" r="5" fill="#f6f1e6" opacity="0.6"/>
    <text x="670" y="120" text-anchor="middle" opacity="0.65">TOOL CALL</text>
    <circle cx="930" cy="140" r="5" fill="#f6f1e6" opacity="0.6"/>
    <text x="930" y="120" text-anchor="middle" opacity="0.65">POLICY CHECK</text>
    <circle cx="1190" cy="140" r="5" fill="#f6f1e6" opacity="0.6"/>
    <text x="1190" y="120" text-anchor="middle" opacity="0.65">EXECUTION</text>
    <circle cx="1450" cy="140" r="5" fill="#f6f1e6" opacity="0.6"/>
    <text x="1450" y="120" text-anchor="middle" opacity="0.65">COMPLETION</text>
  </g>

  <g font-family="monospace" font-size="13">
    <text x="60" y="235" fill="#f6f1e6" opacity="0.75">ACTOR</text>
    <line x1="150" y1="230" x2="1450" y2="230" stroke="#f6f1e6" stroke-opacity="0.15" stroke-width="1"/>
    <circle cx="410" cy="230" r="7" fill="#f4d44d"/>

    <text x="60" y="300" fill="#f6f1e6" opacity="0.75">ACTION</text>
    <line x1="150" y1="295" x2="1450" y2="295" stroke="#f6f1e6" stroke-opacity="0.15" stroke-width="1"/>
    <circle cx="670" cy="295" r="7" fill="#f4d44d"/>

    <text x="60" y="365" fill="#f6f1e6" opacity="0.75">DATA TOUCHED</text>
    <line x1="150" y1="360" x2="1450" y2="360" stroke="#f6f1e6" stroke-opacity="0.15" stroke-width="1"/>
    <circle cx="670" cy="360" r="7" fill="#f4d44d"/>
    <circle cx="1190" cy="360" r="7" fill="#f4d44d" fill-opacity="0.55"/>

    <text x="60" y="430" fill="#f6f1e6" opacity="0.75">BASIS</text>
    <line x1="150" y1="425" x2="1450" y2="425" stroke="#f6f1e6" stroke-opacity="0.15" stroke-width="1"/>
    <circle cx="930" cy="425" r="7" fill="#f4d44d"/>

    <text x="60" y="495" fill="#f6f1e6" opacity="0.75">DISPOSITION</text>
    <line x1="150" y1="490" x2="1450" y2="490" stroke="#f6f1e6" stroke-opacity="0.15" stroke-width="1"/>
    <circle cx="1450" cy="490" r="7" fill="#f4d44d"/>
  </g>

  <text x="80" y="580" fill="#f6f1e6" font-family="monospace" font-size="13" opacity="0.45">a field captured late is a field an operator has to reconstruct from memory</text>
</svg>
