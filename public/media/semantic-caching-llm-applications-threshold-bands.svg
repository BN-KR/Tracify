<svg viewBox="0 0 1600 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scBandsTitle scBandsDesc">
  <title id="scBandsTitle">A similarity axis from 0.0 to 1.0 split into reject, verify, and still-verify bands</title>
  <desc id="scBandsDesc">A black canvas shows a horizontal similarity score axis from 0.0 to 1.0 divided into three bands: below 0.80 labeled reject and compute fresh, 0.80 to 0.93 labeled verify required, and 0.93 to 1.0 labeled still verify. The Pro-versus-Team refund example at similarity 0.94 is plotted as a marker inside the still-verify band with a callout reading entity check fails: plan mismatch, illustrating that even a very high similarity score must clear an explicit check before it is served.</desc>
  <rect width="1600" height="640" fill="#0a0a0a"/>
  <text x="60" y="60" fill="#f4d44d" font-family="monospace" font-size="18" letter-spacing="1">SIMILARITY THRESHOLD BANDS</text>
  <text x="60" y="88" fill="#f6f1e6" font-family="monospace" font-size="13" opacity="0.6">no band skips the verify step</text>

  <!-- axis -->
  <line x1="140" y1="300" x2="1480" y2="300" stroke="#f6f1e6" stroke-opacity="0.35" stroke-width="2"/>
  <text x="120" y="330" fill="#f6f1e6" font-family="monospace" font-size="13" opacity="0.6" text-anchor="end">0.0</text>
  <text x="1480" y="330" fill="#f6f1e6" font-family="monospace" font-size="13" opacity="0.6">1.0</text>

  <!-- band 1: reject, 0.0-0.80 -> x 140 to 1211 (proportional) -->
  <rect x="140" y="260" width="1072" height="80" fill="none" stroke="#e06a5a" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="160" y="245" fill="#e06a5a" font-family="monospace" font-size="13">below 0.80 — REJECT</text>
  <text x="160" y="365" fill="#f6f1e6" font-family="monospace" font-size="12" opacity="0.55">compute fresh, always</text>

  <!-- band 2: verify, 0.80-0.93 -> x 1211 to 1394 -->
  <rect x="1212" y="260" width="182" height="80" fill="#f4d44d" fill-opacity="0.12" stroke="#f4d44d" stroke-width="1.5"/>
  <text x="1212" y="245" fill="#f4d44d" font-family="monospace" font-size="12">0.80–0.93</text>
  <text x="1212" y="365" fill="#f4d44d" font-family="monospace" font-size="11">VERIFY</text>

  <!-- band 3: still verify, 0.93-1.0 -> x 1394 to 1480 -->
  <rect x="1395" y="260" width="85" height="80" fill="#f4d44d" fill-opacity="0.22" stroke="#f4d44d" stroke-width="1.5"/>
  <text x="1330" y="220" fill="#f4d44d" font-family="monospace" font-size="12">0.93+ — STILL VERIFY</text>

  <!-- marker at 0.94 -->
  <line x1="1404" y1="230" x2="1404" y2="380" stroke="#f4d44d" stroke-width="2"/>
  <circle cx="1404" cy="300" r="7" fill="#f4d44d"/>

  <rect x="920" y="420" width="480" height="150" fill="none" stroke="#f4d44d" stroke-width="1.5"/>
  <text x="950" y="455" fill="#f4d44d" font-family="monospace" font-size="14" font-weight="bold">0.94 — Pro vs Team refund query</text>
  <text x="950" y="485" fill="#f6f1e6" font-family="monospace" font-size="13" opacity="0.75">lands in "still verify"</text>
  <text x="950" y="512" fill="#e06a5a" font-family="monospace" font-size="13">entity check fails: plan mismatch</text>
  <text x="950" y="540" fill="#f6f1e6" font-family="monospace" font-size="13" opacity="0.6">result: reclassified as a miss</text>
  <line x1="1160" y1="420" x2="1404" y2="345" stroke="#f4d44d" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="60" y="610" fill="#f6f1e6" font-family="monospace" font-size="13" opacity="0.45">a higher threshold narrows the match pool — it does not replace the check</text>
</svg>
