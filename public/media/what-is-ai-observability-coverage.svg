<svg viewBox="0 0 1600 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="waoCovTitle waoCovDesc">
  <title id="waoCovTitle">A coverage ladder comparing narrow logging, a point tracer, and a full four-layer implementation</title>
  <desc id="waoCovDesc">A black canvas shows three cream columns of increasing height labeled RAW LOGS, TRACING ONLY, and FULL IMPLEMENTATION, each annotated with what question that level of coverage can and cannot answer, illustrating that observability is a spectrum rather than a single on/off state.</desc>
  <rect width="1600" height="760" fill="#0a0a0a"/>
  <text x="800" y="60" text-anchor="middle" fill="#f6f1e6" font-family="monospace" font-size="20" letter-spacing="2">COVERAGE IS A SPECTRUM, NOT A SWITCH</text>

  <g font-family="monospace" text-anchor="middle">
    <rect x="180" y="500" width="320" height="160" fill="#f6f1e6"/>
    <text x="340" y="555" fill="#0a0a0a" font-size="18" font-weight="700">RAW LOGS</text>
    <text x="340" y="595" fill="#0a0a0a" font-size="12">answers: did it crash?</text>
    <text x="340" y="620" fill="#0a0a0a" font-size="12">misses: was it correct?</text>

    <rect x="640" y="360" width="320" height="300" fill="#f6f1e6"/>
    <text x="800" y="415" fill="#0a0a0a" font-size="18" font-weight="700">TRACING ONLY</text>
    <text x="800" y="455" fill="#0a0a0a" font-size="12">answers: what steps ran?</text>
    <text x="800" y="480" fill="#0a0a0a" font-size="12">misses: was the output good?</text>

    <rect x="1100" y="180" width="320" height="480" fill="#f4d44d"/>
    <text x="1260" y="235" fill="#0a0a0a" font-size="18" font-weight="700">FULL IMPLEMENTATION</text>
    <text x="1260" y="275" fill="#0a0a0a" font-size="12">traces + evaluation +</text>
    <text x="1260" y="300" fill="#0a0a0a" font-size="12">cost/latency + owned alerts</text>
  </g>
</svg>
