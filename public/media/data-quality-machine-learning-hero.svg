<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dqTitle dqDesc">
  <title id="dqTitle">A production dataset shown as rows, with five rows flagged for different quality problems</title>
  <desc id="dqDesc">A black canvas shows a grid of dataset rows rendered as horizontal bars. Most rows are plain cream outlines, but five rows are individually flagged in acid yellow with small labels reading mislabeled, leaked, duplicate, stale eval, and underrepresented, illustrating that data quality problems are row-level and specific rather than one aggregate score.</desc>
  <rect width="1600" height="900" fill="#0a0a0a"/>
  <text x="100" y="90" fill="#f4d44d" font-family="monospace" font-size="20" letter-spacing="2">DATA QUALITY IN MACHINE LEARNING</text>
  <text x="100" y="122" fill="#f6f1e6" font-family="monospace" font-size="14" opacity="0.6">a clean-looking table can still be wrong, row by row</text>

  <g font-family="monospace" font-size="12">
    <!-- header -->
    <text x="100" y="170" fill="#f6f1e6" opacity="0.5">id</text>
    <text x="200" y="170" fill="#f6f1e6" opacity="0.5">input</text>
    <text x="780" y="170" fill="#f6f1e6" opacity="0.5">label</text>
    <text x="1000" y="170" fill="#f6f1e6" opacity="0.5">source</text>
    <text x="1250" y="170" fill="#f6f1e6" opacity="0.5">flag</text>
    <line x1="100" y1="182" x2="1500" y2="182" stroke="#f6f1e6" stroke-opacity="0.25"/>

    <!-- plain rows -->
    <g stroke="#f6f1e6" stroke-opacity="0.28" fill="none">
      <rect x="100" y="200" width="1400" height="46"/>
      <rect x="100" y="340" width="1400" height="46"/>
      <rect x="100" y="480" width="1400" height="46"/>
      <rect x="100" y="620" width="1400" height="46"/>
      <rect x="100" y="760" width="1400" height="46"/>
    </g>

    <!-- flagged rows -->
    <g>
      <rect x="100" y="246" width="1400" height="46" fill="#f4d44d" fill-opacity="0.1" stroke="#f4d44d" stroke-width="2"/>
      <text x="1250" y="274" fill="#f4d44d" font-weight="bold">mislabeled</text>

      <rect x="100" y="386" width="1400" height="46" fill="#f4d44d" fill-opacity="0.1" stroke="#f4d44d" stroke-width="2"/>
      <text x="1250" y="414" fill="#f4d44d" font-weight="bold">leaked</text>

      <rect x="100" y="526" width="1400" height="46" fill="#f4d44d" fill-opacity="0.1" stroke="#f4d44d" stroke-width="2"/>
      <text x="1250" y="554" fill="#f4d44d" font-weight="bold">duplicate</text>

      <rect x="100" y="666" width="1400" height="46" fill="#f4d44d" fill-opacity="0.1" stroke="#f4d44d" stroke-width="2"/>
      <text x="1250" y="694" fill="#f4d44d" font-weight="bold">stale eval</text>

      <rect x="100" y="806" width="1400" height="46" fill="#f4d44d" fill-opacity="0.1" stroke="#f4d44d" stroke-width="2"/>
      <text x="1250" y="834" fill="#f4d44d" font-weight="bold">underrepresented</text>
    </g>
  </g>

  <text x="100" y="870" fill="#f6f1e6" font-family="monospace" font-size="13" opacity="0.45">the table still passes a row-count check. that is exactly the problem.</text>
</svg>
