[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tracify"
version = "0.1.0"
authors = [
  { name="Tracify Team", email="hello@tracify.tech" },
]
description = "Observability and tracing for AI agents."
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.25.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
"Homepage" = "https://tracify.tech"
"Documentation" = "https://docs.tracify.tech"
"Bug Tracker" = "https://github.com/tracify/python-sdk/issues"
