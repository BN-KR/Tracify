[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tracify-sdk"
version = "0.4.0"
authors = [
  { name="Tracify Team", email="hello@tracify.tech" },
]
description = "Observability, runtime enforcement, and tracing for AI agents."
license = "MIT"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.25.0",
    "httpx>=0.24.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
"Homepage" = "https://tracify.tech"
"Documentation" = "https://docs.tracify.tech"
"Bug Tracker" = "https://github.com/tracify/python-sdk/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.25"]
langgraph = ["langchain-core>=0.2", "langgraph>=0.2"]
test = ["pytest>=8", "pytest-asyncio>=0.24", "httpx2==2.13.1", "openai==3.31.0", "anthropic==1.14.0", "langgraph==1.2.15", "langchain-core==1.6.10"]
