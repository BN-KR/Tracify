[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "5to1r"
version = "0.2.0"
authors = [
  { name="Tracify Team", email="hello@tracify.tech" },
]
description = "Observability, runtime enforcement, and tracing for AI agents."
license = "MIT"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.25.0",
    "httpx>=0.24.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
"Homepage" = "https://tracify.tech"
"Documentation" = "https://docs.tracify.tech"
"Bug Tracker" = "https://github.com/tracify/python-sdk/issues"
