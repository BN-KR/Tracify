[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fivetoone"
version = "0.1.0"
authors = [
  { name="5to1r Team", email="hello@5to1r.com" },
]
description = "Observability and tracing for AI agents."
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.25.0",
]

[project.urls]
"Homepage" = "https://5to1r.com"
"Documentation" = "https://docs.5to1r.com"
"Bug Tracker" = "https://github.com/5to1r/python-sdk/issues"
